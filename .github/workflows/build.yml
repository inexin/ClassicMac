name: build

# Builds and tests every push and pull request on Windows, Linux and macOS.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet test --solution ClassicMac.slnx -c Release
        env:
          CLASSICMAC_BASELINE_FAILURES: ${{ runner.temp }}/classicmac-baselines
      # A screenshot that differs from its baseline: the actual frame and the diff, to look at.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: baseline-failures-${{ matrix.os }}
          path: ${{ runner.temp }}/classicmac-baselines
          if-no-files-found: ignore
